name: CI/CD Java & Docker Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Run Unit Tests
        run: mvn test
        
      # Step A: Increase Patch Version automatically (1.0.0 -> 1.0.1)
      - name: Bump Patch Version
        id: bump_version
        run: |
          mvn build-helper:parse-version versions:set \
            -DnewVersion=\${parsedVersion.majorVersion}.\${parsedVersion.minorVersion}.\${parsedVersion.nextIncrementalVersion} \
            versions:commit
          
          # Extract current version to pass to subsequent steps
          JAR_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=${JAR_VERSION}" >> $GITHUB_OUTPUT
          echo "Updated project version to: ${JAR_VERSION}"

      # Steps B & C: Compile and Package artifact into JAR
      - name: Compile and Package Artifact
        run: mvn clean package -DskipTests

      # Step D: Upload build artifact to GitHub Actions artifacts
      - name: Create Artifact Item for the Build
        uses: actions/upload-artifact@v4
        with:
          name: java-app-v${{ steps.bump_version.outputs.VERSION }}
          path: target/*.jar

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step E & F: Build and Push Docker image tagged automatically with Jar version
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.USERNAME }}/my-app:${{ steps.bump_version.outputs.VERSION }}
            ${{ secrets.USERNAME }}/my-app:latest

      # Step G: Download and Run Docker image on the runner
      - name: Run Docker Image
        run: |
          IMAGE="${{ secrets.USERNAME }}/my-app:${{ steps.bump_version.outputs.VERSION }}"
          
          echo "Pulling image: $IMAGE"
          docker pull $IMAGE
          
          echo "Starting container..."
          docker run -d --name my-app-test -p 8080:8080 $IMAGE
          
          sleep 5
          
          echo "Checking running container..."
          docker ps
          
          echo "Verifying container user (non-root)..."
          USER_ID=$(docker exec my-app-test id -u)
          echo "Running user ID: $USER_ID"
          if [ "$USER_ID" -eq 0 ]; then
            echo "ERROR: Container is running as root!" && exit 1
          else
            echo "SUCCESS: Container is running as non-root user (UID: $USER_ID)."
          fi
