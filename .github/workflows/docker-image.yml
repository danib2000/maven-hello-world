name: CI/CD Java & Docker Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
        
      # Increase Patch Version automatically 
      - name: Bump Patch Version
        id: bump_version
        run: |
          cd myapp
          mvn build-helper:parse-version versions:set \
            -DnewVersion=\${parsedVersion.majorVersion}.\${parsedVersion.minorVersion}.\${parsedVersion.nextIncrementalVersion} \
            versions:commit
          
          # Extract current version to pass to subsequent steps
          JAR_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=${JAR_VERSION}" >> $GITHUB_OUTPUT
          echo "Updated project version to: ${JAR_VERSION}"

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      # Build and Push Docker image tagged automatically with Jar version
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.USERNAME }}/my-app:${{ steps.bump_version.outputs.VERSION }}
            ${{ secrets.USERNAME }}/my-app:latest

      # Download and Run Docker image on the runner
      - name: Run Docker Image
        run: |
          IMAGE="${{ secrets.USERNAME }}/my-app:${{ steps.bump_version.outputs.VERSION }}"
          
          echo "Pulling image: $IMAGE"
          docker pull $IMAGE
          
          echo "Starting container..."
          docker run --name my-app-test -p 8080:8080 $IMAGE
          
          else
            echo "SUCCESS: Container is running as non-root user (UID: $USER_ID)."
          fi
